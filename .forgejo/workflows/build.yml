name: Build and push packages

on:
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/build.yml
      - 'packages/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # "none" keeps the matrix non-empty, so build-and-push always reports a status
      packages: ${{ steps.filter.outputs.changes == '[]' && '["none"]' || steps.filter.outputs.changes }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        uses: https://github.com/dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ forgejo.event_name == 'push' && forgejo.ref || '' }}
          filters: |
            aardvark-dns:
              - 'packages/aardvark-dns/**'
              - '.forgejo/workflows/build.yml'
            netavark:
              - 'packages/netavark/**'
              - '.forgejo/workflows/build.yml'
            podman:
              - 'packages/podman/**'
              - '.forgejo/workflows/build.yml'

  build-and-publish:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ARCH: arm64
      COMPONENT: main
      DISTRIBUTION: trixie
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build .deb and extract
        if: matrix.package != 'none'
        uses: https://data.forgejo.org/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          target: export
          platforms: linux/${{ env.ARCH }}
          build-args: |
            PACKAGE=${{ matrix.package }}
          outputs: type=local,dest=out

      - name: Publish .deb to the apt repository
        if: matrix.package != 'none' && forgejo.event_name == 'push'
        run: |
          curl \
            --fail \
            --user "${{ forgejo.repository_owner }}:${{ secrets.PACKAGE_TOKEN }}" \
            --upload-file out/*.deb \
            "${{ forgejo.server_url }}/api/packages/${{ forgejo.repository_owner }}/debian/pool/${{ env.DISTRIBUTION }}/${{ env.COMPONENT }}/upload"
